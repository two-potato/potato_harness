openapi: 3.1.0
info:
  title: Notifications Service Contract (R1 target)
  version: 1.0.0
  description: Target API only; not deployed. Authorization and entity owner checks
    are mandatory.
servers:
- url: http://internal.service.invalid
paths:
  /internal/v1/deliveries:
    post:
      operationId: notificationsV1
      summary: Schedule an idempotent notification
      responses:
        '200':
          description: Accepted/OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Rate limited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - event_id
              properties:
                event_id:
                  type: string
                  format: uuid
                listing_id:
                  type: string
                content_sha256:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                verdict:
                  enum:
                  - APPROVE
                  - REJECT
                  - REVIEW
                notification_id:
                  type: string
components:
  securitySchemes:
    service_identity:
      type: http
      scheme: bearer
      description: Trusted internal service identity, not a shared superuser token
    user_identity:
      type: http
      scheme: bearer
      description: App session authenticated and object scoped
    consented_session:
      type: apiKey
      in: header
      name: X-Session-Token
    public_or_user:
      type: http
      scheme: bearer
security:
- service_identity: []
