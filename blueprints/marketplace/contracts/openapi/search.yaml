openapi: 3.1.0
info:
  title: Search Service Contract (R1 target)
  version: 1.0.0
  description: Target API only; not deployed. Authorization and entity owner checks
    are mandatory.
servers:
- url: https://api.example.invalid
paths:
  /v1/search:
    get:
      operationId: searchV1
      summary: Search published listings
      responses:
        '200':
          description: Accepted/OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Rate limited
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
components:
  securitySchemes:
    service_identity:
      type: http
      scheme: bearer
      description: Trusted internal service identity, not a shared superuser token
    user_identity:
      type: http
      scheme: bearer
      description: App session authenticated and object scoped
    consented_session:
      type: apiKey
      in: header
      name: X-Session-Token
    public_or_user:
      type: http
      scheme: bearer
security:
- public_or_user: []
