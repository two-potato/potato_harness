name: Harness validation and portfolio demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate contracts, controller and package
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-validation.txt
          .venv/bin/python -m pip install -r blueprints/marketplace/requirements-dev.txt
          .venv/bin/python tools/validate_pack.py
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tools/verify_manifest.py
          .venv/bin/python -m harness.demo --output .runtime/ci-demo
          .venv/bin/python -m harness.halo --output .runtime/ci-halo
  opencode-omo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned local runtimes
        working-directory: integrations/opencode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node src/bootstrap.mjs
      - name: Actual OMO import and restrictive configuration tests
        working-directory: integrations/opencode
        run: node_modules/.bin/bun test tests
      - name: Real SDK and OMO with local provider fixture
        working-directory: integrations/opencode
        run: PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/bun src/protocol-smoke.mjs
