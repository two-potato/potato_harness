name: Harness validation and portfolio demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate contracts, controller and package
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-validation.txt
          .venv/bin/python -m pip install -r blueprints/marketplace/requirements-dev.txt
          .venv/bin/python tools/validate_pack.py
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tools/verify_manifest.py
          .venv/bin/python -m harness.demo --output .runtime/ci-demo
          .venv/bin/python -m harness.halo --output .runtime/ci-halo
  opencode-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: V2 contract tests (no SDK dependency)
        run: node --test integrations/opencode-v2/tests/*.test.mjs
      - name: Install only v2 SDK and pinned Bun
        working-directory: integrations/opencode-v2
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/bun/install.js
          test "$(node_modules/.bin/bun --version)" = 1.4.4
          test "$(node -p 'require(\"./node_modules/@opencode/sdk/package.json\").version')" = 2.4.1
      - name: Real V2 embedded SDK synthetic HTTP fixture
        working-directory: integrations/opencode-v2
        run: node_modules/.bin/bun src/smoke.mjs
      - name: V2 actual host worker and runtime (injected sandbox seam)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-validation.txt
          PYTHONPATH="$PWD" .venv/bin/python tests/runtime/v2_sdk_host_fixture.py
