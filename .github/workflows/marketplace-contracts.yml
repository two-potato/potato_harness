name: Marketplace blueprint contracts
on:
  push:
    paths:
      - "blueprints/marketplace/**"
      - "tools/marketplace.py"
      - "tests/test_marketplace_entrypoint.py"
      - "tests/test_marketplace_generator.py"
      - ".github/workflows/marketplace-contracts.yml"
      - "docs/marketplace/**"
      - ".opencode/commands/marketplace.md"
  pull_request:
    paths:
      - "blueprints/marketplace/**"
      - "tools/marketplace.py"
      - "tests/test_marketplace_entrypoint.py"
      - "tests/test_marketplace_generator.py"
      - ".github/workflows/marketplace-contracts.yml"
      - "docs/marketplace/**"
      - ".opencode/commands/marketplace.md"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r blueprints/marketplace/requirements-dev.txt
      - run: PYTHONPATH=blueprints/marketplace python -m unittest discover -s blueprints/marketplace/tests -v
      - run: python -m unittest discover -s tests -p 'test_marketplace_*.py' -v
      - run: python tools/marketplace.py status
      - run: python tools/marketplace.py validate blueprints/marketplace/examples/marketplace.factory.example.yaml
  generated-scaffold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: potato_ci
          POSTGRES_PASSWORD: potato_ci_only
          POSTGRES_DB: potato_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U potato_ci -d potato_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: "potato-scaffold-ci-isolated-secret-key-never-use-in-deployment"
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      PGDATABASE: potato_ci
      PGUSER: potato_ci
      PGPASSWORD: potato_ci_only
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      MARKETPLACE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate sandbox source without executing it
        run: |
          python -m pip install -r blueprints/marketplace/requirements-dev.txt
          python tools/marketplace.py generate demo-market-kz --output "$RUNNER_TEMP/demo-market-kz"
      - name: Django checks, migration and object isolation tests against PostgreSQL
        run: |
          python -m pip install -r "$RUNNER_TEMP/demo-market-kz/backend/requirements.txt"
          cd "$RUNNER_TEMP/demo-market-kz/backend"
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test catalog
      - name: Next.js TypeScript build (generated development storefront)
        run: |
          cd "$RUNNER_TEMP/demo-market-kz/frontend"
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Real local HTTP smoke through Next.js session proxy
        env:
          # Only this trusted CI step uses HTTP developer cookies/admin on 127.0.0.1.
          DJANGO_DEBUG: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/demo-market-kz/backend"
          python manage.py shell -c 'from django.contrib.auth import get_user_model; from django.contrib.auth.models import Group; U=get_user_model(); a=U.objects.create_user(username="smoke_seller",password="fixture-seller-01"); a.groups.add(Group.objects.get(name="seller")); b=U.objects.create_user(username="smoke_moderator",password="fixture-moderator-02",is_staff=True); b.groups.add(Group.objects.get(name="moderator")); U.objects.create_user(username="smoke_buyer",password="fixture-buyer-03")'
          python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django-http.log" 2>&1 &
          DJANGO_PID=$!
          cd ../frontend
          npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/next-http.log" 2>&1 &
          NEXT_PID=$!
          cleanup() {
            code=$?
            if [ "$code" -ne 0 ]; then
              tail -n 80 "$RUNNER_TEMP/django-http.log" "$RUNNER_TEMP/next-http.log" || true
            fi
            kill "$DJANGO_PID" "$NEXT_PID" 2>/dev/null || true
            return "$code"
          }
          trap cleanup EXIT
          python "$GITHUB_WORKSPACE/blueprints/marketplace/tests/http_smoke.py"
